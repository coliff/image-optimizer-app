name: Publish

# Builds, tests and publishes a GitHub Release with the installer. Run it from the Actions tab
# ("Publish" > "Run workflow"), or push a version tag such as v0.2.0.
# Installed copies of the app find the release the next time they start and update themselves.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, like 0.2.0 (leave empty to use <Version> from Directory.Build.props)"
        required: false
        type: string

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Work out the version
        id: version
        shell: pwsh
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if ($env:EVENT -eq 'push') {
            $version = $env:REF_NAME.TrimStart('v')
          } elseif ($env:INPUT_VERSION) {
            $version = $env:INPUT_VERSION.Trim().TrimStart('v')
          } else {
            $version = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          }
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "'$version' isn't a version like 1.2.3" }
          if ($env:EVENT -ne 'push') {
            # A manual run creates the tag itself, so stop early if that version was already released.
            gh api "repos/$env:GITHUB_REPOSITORY/git/ref/tags/v$version" --silent 2>$null
            if ($LASTEXITCODE -eq 0) { throw "Tag v$version already exists. Bump the version first." }
            $global:LASTEXITCODE = 0
          }
          "VERSION=$version" >> $env:GITHUB_ENV
          "TAG=v$version" >> $env:GITHUB_ENV
          "tag=v$version" >> $env:GITHUB_OUTPUT

      - name: Download optimizer tools
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./scripts/fetch-tools.ps1

      - name: Build
        run: dotnet build ImageOptimizer.sln --configuration Release -p:Version=$env:VERSION

      - name: Test
        env:
          IMAGEOPTIMIZER_REQUIRE_TOOLS: "1"
          IMAGEOPTIMIZER_TOOLS: ${{ github.workspace }}\tools
        run: dotnet test --solution ImageOptimizer.sln --configuration Release --no-build

      - name: Publish
        run: dotnet publish src/ImageOptimizer.App/ImageOptimizer.App.csproj --configuration Release --runtime win-x64 --self-contained false --output publish -p:Version=$env:VERSION

      - name: Pack the installer and update packages
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./scripts/pack-installer.ps1 -Version $env:VERSION -WithDeltas

      - name: Create the tag
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$env:GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$env:TAG" -f "sha=$env:GITHUB_SHA" --silent
          if ($LASTEXITCODE -ne 0) { throw "Couldn't create tag $env:TAG" }

      - name: Publish the GitHub Release
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          dotnet vpk upload github --repoUrl "https://github.com/$env:GITHUB_REPOSITORY" --channel win --outputDir releases `
            --token $env:GITHUB_TOKEN --tag $env:TAG --releaseName "Image Optimizer $env:VERSION" --publish
          if ($LASTEXITCODE -ne 0) { throw 'vpk upload failed' }

  virustotal:
    needs: release
    permissions:
      contents: read
    # actionlint doesn't accept the newer "$/" self-repository form yet.
    uses: ./.github/workflows/virustotal.yml # zizmor: ignore[self-repository]
    with:
      tag: ${{ needs.release.outputs.tag }}
    secrets:
      VIRUSTOTAL_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
